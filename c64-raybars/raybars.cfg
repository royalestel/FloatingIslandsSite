# ld65 config for raybars: one-file PRG with a BASIC "SYS 2061" stub.
MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;   # ROMs banked out: all free
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $C7FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;               # self-modifying
    RASTER:   load = MAIN,     type = rw, align = $100; # cycle-exact code
    TABLES:   load = MAIN,     type = ro, align = $100;
    RAMPS:    load = MAIN,     type = ro, align = $100;
    BSS:      load = MAIN,     type = bss, align = $100;
}
