# ld65 config for the anim programs: one-file PRG with a BASIC "SYS 2061" stub.
# The generator knows where the bar profiles are ($4000) so the scene stream can
# hold absolute pointers.
MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $3800 - $0801, file = %O, fill = yes;
    TAB:      start = $3800, size = $0800, file = %O, fill = yes;
    PROF:     start = $4000, size = $2000, file = %O, fill = yes;   # the bar profiles
    SCENE:    start = $6000, size = $6000, file = %O;               # the scene stream (<= 24 KB)
    BSSM:     start = $C000, size = $0400, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;               # self-modifying
    RASTER:   load = MAIN,     type = rw, align = $100; # cycle-exact code
    PROF:     load = PROF,     type = ro;
    SCENE:    load = SCENE,    type = ro;
    BSS:      load = BSSM,     type = bss, align = $100;
}
