# ld65 config for part1.prg: BASIC "SYS 2061" stub; everything below $C000 in the PRG.
#  $0801  code     $1800 swatch tables    $2000 bar profiles (part1_gen.py's pointers)
#  $2800  row set for even frames   $4000 row set for odd frames   $5000 the scene
#  $3FFF  stays free: it is the VIC's idle byte
MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $1800 - $0801, file = %O, fill = yes;
    TAB:      start = $1800, size = $0800, file = %O, fill = yes;
    PROF:     start = $2000, size = $0800, file = %O, fill = yes;
    ROWS0:    start = $2800, size = $1800, file = %O, fill = yes;
    ROWS1:    start = $4000, size = $1000, file = %O, fill = yes;
    SCENE:    start = $5000, size = $7000, file = %O;
    BSSM:     start = $C000, size = $0400, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;
    TABLES:   load = TAB,      type = ro, align = $100;
    PROF:     load = PROF,     type = ro;
    ROWS0:    load = ROWS0,    type = rw;
    ROWS1:    load = ROWS1,    type = rw;
    SCENE:    load = SCENE,    type = ro;
    BSS:      load = BSSM,     type = bss, align = $100;
}
