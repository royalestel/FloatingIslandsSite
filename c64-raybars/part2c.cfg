MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $1000 - $0801, file = %O, fill = yes;
    PATSL:    start = $1000, size = $0700, file = %O, fill = yes;   # image positions; the loader puts the tables at $2B00.. (above the tune)
    OFFSL:    start = $1700, size = $2000, file = %O;
    PATS:     start = $2B00, size = $0700;
    OFFS:     start = $3200, size = $2000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;
    PATS:     load = PATSL, run = PATS, type = ro, align = $100;
    OFFS:     load = OFFSL, run = OFFS, type = ro;
}
