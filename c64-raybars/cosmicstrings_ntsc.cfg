# ld65 config for cosmicstrings on the NTSC cartridge: as cosmic.cfg, but nothing between $0801 and $2AFF: the tune (Alpha.sid, $1000-$2A33) stays resident.
# The 72 ramp pages start at $2B00 and the code is in $7300-$7FFF.  The VIC sees bank 2 ($8000-$bfff): sprite pointers at $87f8, the ship's sprites
# at $8800-$90ff, the idle byte at $bfff.
MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $2B00 - $0801, file = %O, fill = yes;
    R1:       start = $2B00, size = $4800, file = %O, fill = yes;  # 72 ramp pages
    MAIN3:    start = $7300, size = $0D00, file = %O, fill = yes;  # code
    BSSM:     start = $8000, size = $0400, file = %O, fill = yes;  # work arrays
    SCR:      start = $8400, size = $03F8, file = %O, fill = yes;  # screen (unfetched):
                                                                   # display code
    PTRS:     start = $87F8, size = $0008, file = %O, fill = yes;  # sprite pointers
    SPR:      start = $8800, size = $0900, file = %O, fill = yes;  # 36 sprite blocks
    R2:       start = $9100, size = $1500, file = %O, fill = yes;  # tables: h by log d, ...
    TAB:      start = $A600, size = $19FF, file = %O, fill = yes;
    IDLE:     start = $BFFF, size = $0001, file = %O, fill = yes;  # the idle byte
    SQT:      start = $C000, size = $0800, file = %O, fill = yes;  # quarter squares (made at start)
    MAIN2:    start = $C800, size = $0800, file = %O;              # more code
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN3,    type = rw;
    DISP:     load = SCR,      type = rw, align = $100;
    RAMPS1:   load = R1,       type = ro, align = $100;
    BSS:      load = BSSM,     type = bss;
    SPRITES:  load = SPR,      type = ro;
    TABLES2:  load = R2,       type = ro, align = $100;
    TABLES:   load = TAB,      type = ro, align = $100;
    CODE2:    load = MAIN2,    type = rw;
}
