<title>GOLDSHIP Ship Angles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one TV screen with the flight on it, a slim control strip below.
   Single dark look on purpose: a CRT in a dim room. */
:root {
  --bg: #0b0a12;
  --panel: #14121e;
  --line: #2a2640;
  --fg: #e4e1ef;
  --dim: #8d88a6;
  --accent: #7c70da;      /* C64 light blue: the lit hull */
  --display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: .02em; margin: 0; }
.tv { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
canvas { display: block; width: 100%; aspect-ratio: 384 / 272; image-rendering: pixelated; background: #000; border-radius: 6px; max-width: 100%; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.seg { display: flex; gap: 6px; align-items: center; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
button { font: 500 13px var(--mono); color: var(--fg); background: #1d1a2c; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0a12; }
button:focus-visible { outline: 2px solid #d0dc71; outline-offset: 2px; }
.read { color: var(--dim); font-variant-numeric: tabular-nums; margin-left: auto; }
.hint { color: var(--dim); font-size: 13px; }
</style>

<div class="wrap">
  <h1>GOLDSHIP</h1>
  <div class="tv"><canvas id="scr" width="384" height="272"></canvas></div>
  <div class="bar">
    <div class="seg"><span class="lab">Ship</span>
      <button id="f-pair" aria-pressed="true">flicker pair</button>
      <button id="f-one" aria-pressed="false">one frame</button></div>
    <div class="seg"><span class="lab">Stick</span>
      <button id="s-auto" aria-pressed="true">autopilot</button>
      <button id="s-you" aria-pressed="false">you</button></div>
    <div class="seg"><span class="lab">View</span>
      <button id="z-1" aria-pressed="true">whole screen</button>
      <button id="z-2" aria-pressed="false">close-up</button></div>
    <div class="seg"><button id="pause" aria-pressed="false">pause</button></div>
    <span class="read" id="read"></span>
  </div>
  <div class="hint">The ship's two frames swap 60 times a second. Arrow keys take the stick (up = nose down); the autopilot comes back after a few seconds.</div>
</div>

<script>
const D = /*DATA*/null;
// C64 colours
const C = [[0,0,0],[255,255,255],[137,64,54],[122,191,199],[138,70,174],[104,169,65],[62,49,162],[208,220,113],
           [144,95,37],[92,71,0],[187,119,109],[85,85,85],[128,128,128],[172,234,136],[124,112,218],[171,171,171]];
const SHIP = [[C[4], C[14], C[1]], [C[2], C[8], C[7]]];   // normal, collision
const W = 384, H = 272, CX = 192, CY = 136;              // screen with border; window 320 x 200
const WX0 = 32, WX1 = 352, WY0 = 36, WY1 = 236;
const cv = document.getElementById("scr"), ctx = cv.getContext("2d");
const off = document.createElement("canvas"); off.width = W; off.height = H;
const octx = off.getContext("2d"), img = octx.createImageData(W, H), px = img.data;
let zoom = 1;
// a gold bar's colour by row (0..1 across it) and nearness (0 far .. 1 near)
const RAMP = [0, 9, 8, 7, 1];
const DIMR = [0, 11, 9, 8, 7];
function barColour(f, near) {
  const lvl = (1 - Math.abs(2 * f - 1)) * (0.35 + 0.75 * near);
  const k = Math.max(0, Math.min(4, Math.floor(lvl * 4.6)));
  return C[near < 0.35 ? DIMR[k] : RAMP[k]];
}
// ---- the flight (50 Hz, as the C64) ----
const S = { roll: 0, vy: 0, f: 0, y: 0, bits: 0, auto: true, keyT: 0, hit: 0, red: false };
const NB = 3, FLY = 240;
const bars = [];
function spawn(b, t) { b.t = t; b.y = S.y + (Math.random() < 0.35 ? (Math.random() - 0.5) * 30 : (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 90)); b.hit = false; }
for (let i = 0; i < NB; i++) { const b = {}; spawn(b, i * FLY / NB); bars.push(b); }
const depth = t => 12 / (1 + 9 * t / FLY);              // 12 far .. 1.2 at the ship
// autopilot: stick bits (1 up = nose down, 2 down = nose up, 4 left, 8 right), frames
const PLAN = [[0, 50], [8, 70], [0, 40], [2, 45], [0, 30], [4, 90], [0, 30], [1, 50], [0, 25],
              [6, 60], [0, 40], [9, 55], [0, 30], [4, 40], [8, 80], [0, 50], [1, 30], [2, 60], [0, 30]];
let planI = 0, planT = 0;
function autoStick() {
  if (++planT >= PLAN[planI][1]) { planT = 0; planI = (planI + 1) % PLAN.length; }
  let b = PLAN[planI][0];
  // dodge: a bar on a collision course close ahead
  for (const r of bars) if (r.t > FLY * 0.55 && Math.abs(r.y - S.y) < 34) b = (b & 12) | (r.y >= S.y ? 1 : 2);
  return b;
}
function step() {
  if (S.auto && !S.bits) S.stick = autoStick();
  else S.stick = S.bits;
  if (!S.bits && !S.auto && performance.now() - S.keyT > 4000) setAuto(true);
  const b = S.stick, dive = b & 1 && !(b & 2), climb = b & 2 && !(b & 1);
  if (climb) S.vy = Math.min(64, S.vy + 3);
  else if (dive) S.vy = Math.max(-64, S.vy - 3);
  else S.vy = Math.sign(S.vy) * Math.max(0, Math.abs(S.vy) - 3);
  S.y += S.vy / 64;
  if (!(++S.f & 1)) {
    if (b & 4 && !(b & 8)) S.roll = Math.max(-8, S.roll - 1);
    else if (b & 8 && !(b & 4)) S.roll = Math.min(8, S.roll + 1);
    else S.roll -= Math.sign(S.roll);
  }
  S.red = false;
  for (const r of bars) {
    if (++r.t >= FLY) spawn(r, 0);
    const on = Math.abs(r.y - S.y) < 24;
    S.red ||= on;
    if (on && r.t >= FLY - 2 && !r.hit) { r.hit = true; S.hit = 25; }
  }
  if (S.hit) S.hit--;
}
// ---- drawing ----
function put(x, y, c) { const o = (y * W + x) * 4; px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255; }
function draw(parity) {
  const border = S.hit ? C[2] : C[0];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) put(x, y, (x < WX0 || x >= WX1 || y < WY0 || y >= WY1) ? border : C[0]);
  // the bars, farthest first; the world tilts against the roll, in six segments
  const slope = -3 * S.roll / 8 / 72;
  const segs = [[WX0, WX0 + 32], [WX0 + 32, WX0 + 96], [WX0 + 96, CX], [CX, CX + 64], [CX + 64, CX + 128], [CX + 128, WX1]];
  [...bars].sort((a, b) => a.t - b.t).forEach(r => {
    const z = depth(r.t), near = Math.min(1, (12 / z - 1) / 9);
    const yc = CY - (r.y - S.y) / z * 1.0, th = Math.max(2, 48 / z);
    for (const [x0, x1] of segs) {
      const off = Math.round(((x0 + x1) / 2 - CX) * slope);
      const top = Math.round(yc - th / 2 + off);
      for (let y = Math.max(WY0, top); y < Math.min(WY1, top + th); y++) {
        const c = barColour((y - top + 0.5) / th, near);
        for (let x = x0; x < x1; x++) put(x, y, c);
      }
    }
  });
  // the ship: the pair for the eased roll and climb speed
  const ri = Math.max(0, Math.min(8, 4 + Math.sign(S.roll) * Math.floor(Math.abs(S.roll) / 2 + 0.5)));
  const v = S.vy + 4, pi = Math.max(0, Math.min(8, 4 + Math.sign(v) * Math.floor(Math.abs(v) / 16 + 0.5)));
  const fr = D.pairs[ri * 9 + pi][mode === "pair" ? parity : 0], pal = SHIP[S.red ? 1 : 0];
  for (let i = 0; i < 252; i++) {
    const c = +fr[i]; if (!c) continue;
    const y = CY - 10 + Math.floor(i / 12), x = CX - 12 + (i % 12) * 2;
    put(x, y, pal[c - 1]); put(x + 1, y, pal[c - 1]);
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const sw = W / zoom, sh = H / zoom;
  ctx.drawImage(off, CX - sw / 2, CY - sh / 2, sw, sh, 0, 0, W, H);
  return [D.rolls[ri], D.pitches[pi]];
}
// ---- the clock: game at 50 Hz, the ship's frames swap at 60 Hz ----
let mode = "pair", paused = false, t0 = performance.now(), last = t0, acc = 0, lastSwap = -1, swaps = [], read = "";
function frame(t) {
  if (!paused) {
    acc += Math.min(200, t - last);
    while (acc >= 20) { step(); acc -= 20; }
  }
  last = t;
  const swap = Math.floor((t - t0) * 60 / 1000);
  if (swap !== lastSwap) { swaps.push(t); lastSwap = swap; }
  while (swaps.length && swaps[0] < t - 1000) swaps.shift();
  const [r, p] = draw(swap & 1);
  document.getElementById("read").textContent =
    `roll ${r > 0 ? "+" : ""}${r}°  pitch ${p > 0 ? "+" : ""}${p}°  ·  swaps ${swaps.length}/s`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ---- controls ----
function pick(on, off) { on.setAttribute("aria-pressed", "true"); off.setAttribute("aria-pressed", "false"); }
const fp = document.getElementById("f-pair"), fo = document.getElementById("f-one");
fp.onclick = () => { mode = "pair"; pick(fp, fo); };
fo.onclick = () => { mode = "one"; pick(fo, fp); };
const z1 = document.getElementById("z-1"), z2 = document.getElementById("z-2");
z1.onclick = () => { zoom = 1; pick(z1, z2); };
z2.onclick = () => { zoom = 3; pick(z2, z1); };
const sa = document.getElementById("s-auto"), sy = document.getElementById("s-you");
function setAuto(a) { S.auto = a; a ? pick(sa, sy) : pick(sy, sa); }
sa.onclick = () => setAuto(true);
sy.onclick = () => { setAuto(false); S.keyT = performance.now() + 1e9; };
document.getElementById("pause").onclick = e => { paused = !paused; e.target.setAttribute("aria-pressed", paused); };
const KEYS = { ArrowUp: 1, ArrowDown: 2, ArrowLeft: 4, ArrowRight: 8 };
addEventListener("keydown", e => { if (KEYS[e.key]) { S.bits |= KEYS[e.key]; if (S.auto) setAuto(false); S.keyT = performance.now(); e.preventDefault(); } });
addEventListener("keyup", e => { if (KEYS[e.key]) { S.bits &= ~KEYS[e.key]; S.keyT = Math.min(S.keyT, performance.now()); } });
</script>
