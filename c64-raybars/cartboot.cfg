MEMORY {
    TRAM:  start = $0200, size = $0100, type = rw;
    ROMH:  start = $E000, size = $1FFA, file = %O, fill = yes, fillval = $ff;
    VEC:   start = $FFFA, size = 6, file = %O;
}
SEGMENTS {
    CODE:    load = ROMH, type = ro;
    TRAMP:   load = ROMH, run = TRAM, type = rw, define = yes;
    VECTORS: load = VEC,  type = ro;
}
