# ld65 config for animsplit: one-file PRG with a BASIC "SYS 2061" stub.
# $0200-$07ff: the six segment buffers; $4000: bar profiles (anim_gen.py's pointers);
# $a000: the 200 split rows (45 bytes each).
MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $4000 - $0801, file = %O, fill = yes;
    PROF:     start = $4000, size = $2000, file = %O, fill = yes;
    DATA:     start = $6000, size = $4000, file = %O, fill = yes;
    XR:       start = $A000, size = $2400, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;               # self-modifying
    RASTER:   load = MAIN,     type = rw;               # cycle-exact code
    PROWS:    load = MAIN,     type = rw;               # the plain rows (patched jmp operands)
    TABLES:   load = MAIN,     type = ro;
    PROF:     load = PROF,     type = ro;
    DATA:     load = DATA,     type = ro;
    XROWS:    load = XR,       type = rw;               # the split rows
}
