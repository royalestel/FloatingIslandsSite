MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $1000 - $0801, file = %O, fill = yes;
    BGL:      start = $02A8, size = $0156;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;
    BGLOAD:   load = MAIN, run = BGL, type = rw, define = yes, optional = yes;   # the gold chain's background loader (bgload.s), copied to $0300 at start
}
